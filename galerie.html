<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galerie · Filemon a Baucis</title>
  <link rel="icon" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,600&family=Outfit:wght@360;500;650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav solid">
    <a class="brand" href="index.html">
      <img src="favicon.svg" width="34" height="34" alt="" />
      <span>Filemon a Baucis<small>Korfu · Řecko</small></span>
    </a>
    <button class="menu-btn" aria-label="Menu">☰</button>
    <nav class="nav-links" data-nav></nav>
  </header>
  <main class="cal-page">
    <div class="wrap">
      <p class="eyebrow">Fotogalerie</p>
      <h1 class="serif" style="font-size:clamp(2rem,4vw,3.2rem)">U nás, poblíž, opodál a různé.</h1>
      <p class="muted">Kliknutím otevřete foto nadoraz. Studia Filemon a Baucis mají vlastní galerie na stránce <a href="studia.html">Studia</a>.</p>
      <div class="filters" id="filters">
        <button class="filter on" data-filter="all" type="button">Vše</button>
        <button class="filter" data-filter="unas" type="button">U nás</button>
        <button class="filter" data-filter="pobliz" type="button">Poblíž</button>
        <button class="filter" data-filter="opodal" type="button">Opodál</button>
        <button class="filter" data-filter="ruzne" type="button">Různé</button>
      </div>
      <div id="galleries"></div>
    </div>
  </main>
  <script src="js/site.js"></script>
  <script src="js/photos.js"></script>
  <script>
    mountGalleries("galleries", ["unas", "pobliz", "opodal", "ruzne"]).then(() => {
      document.getElementById("filters").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-filter]");
        if (!btn) return;
        document.querySelectorAll(".filter").forEach((b) => b.classList.toggle("on", b === btn));
        const f = btn.dataset.filter;
        document.querySelectorAll(".album-block").forEach((block) => {
          block.classList.toggle("hidden", f !== "all" && block.dataset.album !== f);
        });
      });
    });
  </script>
</body>
</html>
