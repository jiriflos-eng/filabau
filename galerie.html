<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title_gal">Galerie · Filemon a Baucis</title>
  <link rel="icon" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,600&family=Outfit:wght@360;500;650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav solid">
    <a class="brand" href="index.html">
      <img src="favicon.svg" width="34" height="34" alt="" />
      <span>Filemon a Baucis<small data-i18n="brand_sub">Korfu · Řecko</small></span>
    </a>
    <button class="menu-btn" aria-label="Menu">☰</button>
    <nav class="nav-links" data-nav></nav>
  </header>
  <main class="cal-page">
    <div class="wrap">
      <header class="page-head">
        <p class="eyebrow" data-i18n="gal_eye">Fotogalerie</p>
        <h1 data-i18n="gal_h1">U nás, poblíž, opodál a různé.</h1>
        <p class="muted" data-i18n="gal_lead">Kliknutím otevřete foto nadoraz. Studia Filemon a Baucis mají vlastní galerie na stránce Studia.</p>
      </header>
      <div class="filters" id="filters">
        <button class="filter on" data-filter="all" type="button" data-i18n="filter_all">Vše</button>
        <button class="filter" data-filter="unas" type="button" data-i18n="gal_unas">U nás</button>
        <button class="filter" data-filter="pobliz" type="button" data-i18n="gal_pobliz">Poblíž</button>
        <button class="filter" data-filter="opodal" type="button" data-i18n="gal_opodal">Opodál</button>
        <button class="filter" data-filter="ruzne" type="button" data-i18n="gal_ruzne">Různé</button>
      </div>
      <div id="galleries"></div>
    </div>
  </main>
  <footer>
    <div class="wrap">
      <div data-i18n="footer">Filemon a Baucis · Korfu · studia pro klidnou dovolenou</div>
      <div><a href="admin.html" data-i18n="admin_link">Administrace kalendáře</a></div>
    </div>
  </footer>
  <script src="js/i18n.js"></script>
  <script src="js/site.js"></script>
  <script src="js/photos.js"></script>
  <script>
    mountGalleries("galleries", ["unas", "pobliz", "opodal", "ruzne"]).then(() => {
      document.getElementById("filters").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-filter]");
        if (!btn) return;
        document.querySelectorAll(".filter").forEach((b) => b.classList.toggle("on", b === btn));
        const f = btn.dataset.filter;
        document.querySelectorAll(".album-block").forEach((block) => {
          block.classList.toggle("hidden", f !== "all" && block.dataset.album !== f);
        });
      });
    });
  </script>
</body>
</html>
